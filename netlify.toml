[build]
  publish = "_site"
  command = "eleventy"

[build.environment]
  NODE_VERSION = "20"

# Skip HTML post-processing so Pretty URLs cannot 500 unsashed .xml paths.
[build.processing]
  skip_processing = true

[build.processing.html]
  pretty_urls = false

[[headers]]
  for = "/sitemap/index.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/sitemap/index.xml/"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

# Pretty URLs 500s some clients on unsashed .xml URLs. /sitemap/index.xml/ works.
# Forced 301 sends those clients to the trailing-slash path that serves the file.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap/index.xml/"
  status = 301
  force = true
