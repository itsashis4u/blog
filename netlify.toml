[build]
  publish = "_site"
  command = "eleventy"

[build.environment]
  NODE_VERSION = "20"

[build.processing]
  skip_processing = true

[build.processing.html]
  pretty_urls = false

[[headers]]
  for = "/sitemap/index.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/sitemap/index.xml/"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

# Do not 301 /sitemap.xml onto /sitemap.xml/ — Netlify normalizes those
# to the same path and the rule loops. Send clients to a distinct URL.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap/index.xml/"
  status = 301
  force = true
