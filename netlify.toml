[build]
  publish = "_site"
  command = "eleventy"

[build.environment]
  NODE_VERSION = "20"

# Pretty URLs 500s bare `/sitemap.xml` while `/sitemap.xml/` succeeds.
# Keep the Eleventy file as a file with an explicit XML content type.
[build.processing.html]
  pretty_urls = false

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/sitemap/index.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

# Pretty URLs 500s some clients on a root sitemap.xml file.
# Serve the XML from /sitemap/index.xml and rewrite the conventional URL.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap/index.xml"
  status = 200
  force = true
