[build]
  publish = "_site"
  command = "eleventy"

[build.environment]
  NODE_VERSION = "20"

# Pretty URLs 500s bare `/sitemap.xml` while `/sitemap.xml/` succeeds.
# Keep the Eleventy file as a file with an explicit XML content type.
[build.processing.html]
  pretty_urls = false

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/sitemap.xml/"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

# Pretty URLs 500s some clients on bare /sitemap.xml; /sitemap.xml/ is fine.
# Forced 200 rewrite keeps the public URL and serves the working path.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml/"
  status = 200
  force = true
